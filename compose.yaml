name: wechat-rss

services:
  we-mp-rss:
    image: ghcr.io/rachelos/we-mp-rss@sha256:53912fcb3d523d1e640adcb7066cc18123f00e9510882a7982d0991f3113845f
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      DB: sqlite:///data/we_mp_rss.db
      USERNAME: werss_admin
      PASSWORD: ${WERSS_BOOTSTRAP_PASSWORD:?请先运行 scripts/init-secrets.sh}
      SAFE_LIC_KEY: ${SAFE_LIC_KEY:?请先运行 scripts/init-secrets.sh}
      RSS_BASE_URL: ${RSS_BASE_URL:-http://127.0.0.1:8001/}
      RSS_FULL_CONTEXT: "True"
      RSS_PAGE_SIZE: "20"
      RSS_LOCAL: "False"
      MAX_PAGE: "2"
      THREADS: "1"
      BROWSER_TYPE: webkit
      HEADLESS: "true"
      ENABLE_XVFB: "false"
      DEBUG: "False"
      AUTO_RELOAD: "False"
      ENABLE_JOB: "True"
      ARTICLE_STATS_REFRESH_ENABLED: "False"
      REDIS_SERVER_ENABLED: "True"
      REDIS_SERVER_HOST: 127.0.0.1
      REDIS_SERVER_MAX_MEMORY: "64"
      REDIS_URL: redis://127.0.0.1:6379/0
      "GATHER.CONTENT": "True"
      "GATHER.MODEL": web
      "GATHER.CONTENT_MODE": web
      "GATHER.CONTENT_AUTO_CHECK": "False"
      "GATHER.CLEAN_HTML": "False"
      EXPORT_MARKDOWN: "False"
      EXPORT_PDF: "False"
      LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:${WERSS_HOST_PORT:-8001}:8001"
    volumes:
      - ./data:/app/data
    networks:
      - werss-internet
      - feed-proxy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/feed/all.atom', timeout=5).read(1)
      interval: 30s
      timeout: 8s
      retries: 10
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    depends_on:
      we-mp-rss:
        condition: service_healthy
    environment:
      FEED_PREFIX: ${FEED_PREFIX:?请先运行 scripts/init-secrets.sh}
    ports:
      - "127.0.0.1:${CADDY_HOST_PORT:-8080}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - host-ingress
      - feed-proxy
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /config
      - /data
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  readeck:
    image: codeberg.org/readeck/readeck:0.22.3@sha256:ed1c513f8e1d59b1d38fda324ac279eeb65afd0327907e498061ec9fd2f31c15
    restart: unless-stopped
    user: "${HOST_UID:-501}:${HOST_GID:-20}"
    environment:
      TZ: Asia/Shanghai
      READECK_SECRET_KEY: ${READECK_SECRET_KEY:?请先运行 scripts/ensure-readeck-secrets.sh}
      READECK_SERVER_BASE_URL: ${READECK_BASE_URL:-http://127.0.0.1:8002/}
      READECK_ALLOWED_HOSTS: ${READECK_ALLOWED_HOSTS:-127.0.0.1,localhost,readeck,reader.sumerchaser.top}
      READECK_TRUSTED_PROXIES: ${READECK_TRUSTED_PROXIES:-172.16.0.0/12}
      READECK_AUTH_FORWARDED_ENABLED: ${READECK_AUTH_FORWARDED_ENABLED:-false}
      READECK_AUTH_FORWARDED_PROVISIONING: "false"
      READECK_LOG_LEVEL: info
    ports:
      - "127.0.0.1:${READECK_HOST_PORT:-8002}:8000"
    volumes:
      - ./readeck-data:/readeck
    networks:
      - readeck-internet
      - reading
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - /bin/readeck
        - healthcheck
        - -config
        - config.toml
      interval: 30s
      timeout: 8s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  reader-caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    command:
      - /bin/sh
      - -ec
      - |
        wget -q -O /tmp/readeck.css http://readeck:8000/assets/bundle.1cd17fd7.css
        cat /tmp/readeck.css /srv/reader-theme/reader.css > /tmp/bundle.css
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    depends_on:
      readeck:
        condition: service_healthy
    ports:
      - "127.0.0.1:${READER_CADDY_HOST_PORT:-8082}:8080"
    environment:
      READER_PUBLIC_HOST: ${READECK_PUBLIC_HOSTNAME:-reader.sumerchaser.top}
      CF_ACCESS_EMAIL: ${CF_ACCESS_EMAIL:-disabled@example.invalid}
    volumes:
      - ./Caddyfile.reader:/etc/caddy/Caddyfile:ro
      - ./reader-theme:/srv/reader-theme:ro
    networks:
      - host-ingress
      - reading
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /config
      - /data
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  werss-internet:
  readeck-internet:
  host-ingress:
  reading:
    internal: true
  feed-proxy:
    internal: true
