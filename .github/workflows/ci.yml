name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare public example environment
        run: cp .env.example .env
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: Reader JavaScript syntax
        run: node --check reader-ui/app.js
      - name: Compose syntax
        run: docker compose config --quiet
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Diff hygiene
        run: git diff --check
